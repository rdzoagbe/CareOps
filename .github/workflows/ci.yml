name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# This workflow only reads the repository: it checks out, installs, tests and
# builds. Nothing here writes to the repo, so the token gets read access only.
permissions:
  contents: read

jobs:
  build:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
