<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareOps — Healthcare Operations Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --nav:#0c1c2e; --nav-2:#15304c; --nav-3:#1d4470; --nav-ink:#a9bdd2; --nav-ink-2:#6f8aa6;
  --bg:#eef2f7; --panel:#ffffff; --panel-2:#f7f9fc;
  --ink:#122033; --ink-2:#4a5f79; --muted:#77899f; --line:#dde5ee; --line-2:#eaeff5;
  --blue:#1a5fd0; --blue-ink:#0f4197; --blue-soft:#e8f0fe;
  --ok:#0f7a52; --ok-soft:#e3f5ec; --warn:#9a6206; --warn-soft:#fdf1dc; --bad:#b4303c; --bad-soft:#fdeaec;
  --ai:#5b46c4; --ai-soft:#eeeafb;
  --ring:0 0 0 3px rgba(26,95,208,.28);
  --sh:0 1px 2px rgba(18,32,51,.05),0 6px 18px rgba(18,32,51,.05);
  --rad:10px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1521; --panel:#101d2c; --panel-2:#142334; --ink:#e6edf6; --ink-2:#b0c1d6; --muted:#8298b1;
    --line:#22364c; --line-2:#1a2c3f; --blue-soft:#14294a; --ok-soft:#0f2a20; --warn-soft:#2d2212; --bad-soft:#2e1519; --ai-soft:#1d1a3a;
    --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1521; --panel:#101d2c; --panel-2:#142334; --ink:#e6edf6; --ink-2:#b0c1d6; --muted:#8298b1;
  --line:#22364c; --line-2:#1a2c3f; --blue-soft:#14294a; --ok-soft:#0f2a20; --warn-soft:#2d2212; --bad-soft:#2e1519; --ai-soft:#1d1a3a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 13.5px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:246px;background:var(--nav);color:var(--nav-ink);
  padding:16px 12px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:40;
  padding-top:calc(16px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;color:#fff}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(150deg,#2f7ce8,#1740a0);
  display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.2px}
.brand small{display:block;font-size:10px;color:var(--nav-ink-2);font-weight:500;letter-spacing:.3px}
.orgbox{background:#12293f;border:1px solid #234057;border-radius:var(--rad);padding:9px 10px;margin-bottom:12px}
.orgbox label{display:block;font-size:10px;color:var(--nav-ink-2);margin-bottom:3px}
.orgbox select{width:100%;background:#0d2033;border:1px solid #2a4864;color:#e8f0fa;border-radius:7px;padding:6px 7px;font-size:12px}
.navsec{font-size:10px;letter-spacing:.06em;color:#5d7793;padding:14px 10px 5px;font-weight:600}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--nav-ink);font-size:13px;font-weight:500}
.nav a:hover{background:var(--nav-2);color:#fff}
.nav a.on{background:var(--nav-3);color:#fff}
.nav a .ic{width:16px;text-align:center;opacity:.9;font-size:13px}
.nav a .cnt{margin-left:auto;background:#22415e;color:#cfe0f2;font-size:10px;padding:1px 6px;border-radius:20px}
.nav a.on .cnt{background:#2f6fbd;color:#fff}
.main{margin-left:246px;width:calc(100% - 246px);min-width:0}
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.burger{display:none}
.searchwrap{position:relative;flex:1;max-width:460px}
.searchwrap input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 11px 8px 30px}
.searchwrap .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--rad);box-shadow:var(--sh);max-height:360px;overflow:auto;display:none;z-index:50}
.results.on{display:block}
.results button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;padding:8px 11px;border-bottom:1px solid var(--line-2)}
.results button:hover{background:var(--panel-2)}
.results .rid{font-size:11px;color:var(--muted);margin-left:auto}
.topsel{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
select.ctl,button.ctl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px}
select.ctl:hover,button.ctl:hover{border-color:#b9c9dc}
.who{display:flex;align-items:center;gap:7px;padding-left:8px;border-left:1px solid var(--line)}
.ava{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-weight:600;font-size:12px}
.who small{display:block;color:var(--muted);font-size:10.5px}
.demobar{background:#12314f;color:#cfe1f5;font-size:11.5px;padding:5px 20px;display:flex;gap:8px;align-items:center}
.demobar b{color:#fff;font-weight:600}
.page{padding:18px 20px 60px;max-width:1500px}

/* ---------- headers / cards ---------- */
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.phead h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.4px}
.phead p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.phead .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:500}
.btn:hover{background:var(--blue-ink)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#b9c9dc;background:var(--panel-2)}
.btn.sm{padding:5px 9px;font-size:11.5px}
.grid{display:grid;gap:12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c32{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden}
.card .ch{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.card .ch h3{margin:0;font-size:13.5px;font-weight:600}
.card .ch .sub{color:var(--muted);font-size:11.5px}
.card .ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card .cb{padding:14px}
.card .cb.flush{padding:0}
.kpi{padding:13px 14px;cursor:pointer;text-align:left;display:block;width:100%}
.kpi .lab{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:25px;font-weight:600;letter-spacing:-.8px;margin-top:5px;line-height:1.1}
.kpi .sub{font-size:11.5px;margin-top:5px;color:var(--ink-2)}
.kpi:hover{border-color:#b9c9dc}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-info{background:var(--blue-soft);color:var(--blue-ink)}
.t-ai{background:var(--ai-soft);color:var(--ai)}
.t-mute{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- tables ---------- */
.tbar{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;align-items:center}
.tbar input[type=search]{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:190px;flex:1;max-width:280px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:8px 14px;border-bottom:1px solid var(--line);
  background:var(--panel-2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th .ar{opacity:.45;font-size:9px}
th.on{color:var(--blue-ink)} th.on .ar{opacity:1}
td{padding:9px 14px;border-bottom:1px solid var(--line-2);font-size:12.5px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right}
.rid{font-size:11.5px;color:var(--blue-ink);font-weight:500}
.sec{color:var(--muted);font-size:11px}
.pager{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.pager .r{margin-left:auto;display:flex;gap:5px;align-items:center}
.pgb{border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--panel)}
.pgb[disabled]{opacity:.4;cursor:default}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:13px}

/* ---------- lists / bars ---------- */
.rows{display:grid}
.rw{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2);text-align:left;width:100%}
.rw:last-child{border-bottom:0}
.rw:hover{background:var(--panel-2)}
.rw .g{min-width:0;flex:1}
.rw b{font-weight:500;font-size:12.5px;display:block}
.rw .s{color:var(--muted);font-size:11.5px}
.bar{height:6px;border-radius:5px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}
.bar i.ok{background:var(--ok)} .bar i.warn{background:#d79016} .bar i.bad{background:var(--bad)}
.meter{display:flex;gap:9px;align-items:center}
.meter .bar{flex:1}
.meter span{font-size:11.5px;color:var(--ink-2);min-width:42px;text-align:right}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,22,38,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:61;
  transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(10,22,38,.2)}
.drawer.on{transform:none}
.dh{background:var(--panel);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;gap:10px;align-items:flex-start;
  padding-top:calc(13px + env(safe-area-inset-top,0px))}
.dh h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.3px}
.dh .s{color:var(--muted);font-size:12px;margin-top:2px}
.dh .x{margin-left:auto;display:flex;gap:6px}
.dtabs{display:flex;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow:auto}
.dtabs button{padding:9px 11px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.dtabs button.on{color:var(--blue-ink);border-bottom-color:var(--blue);font-weight:500}
.dbody{padding:14px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:132px 1fr;gap:7px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.link{color:var(--blue-ink);font-weight:500;text-align:left}
.link:hover{text-decoration:underline}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:grid;gap:13px}
.tl .ev{position:relative}
.tl .ev::before{content:"";position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--blue)}
.tl .ev b{font-size:12.5px;font-weight:500;display:block}
.tl .ev p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:16px;background:rgba(10,22,38,.45)}
.modal.on{display:grid}
.mbox{background:var(--panel);border-radius:14px;width:min(720px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(10,22,38,.35)}
.mh{display:flex;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel)}
.mh h2{margin:0;font-size:16px;font-weight:600}
.mh .s{color:var(--muted);font-size:12px;margin-top:2px}
.mb{padding:16px 18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:var(--panel)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fld{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);width:100%}
.fld textarea{min-height:72px;resize:vertical}
.note{background:var(--blue-soft);border:1px solid #c6dbfa;color:var(--blue-ink);border-radius:9px;padding:10px 12px;font-size:12px}
:root[data-theme="dark"] .note{border-color:#1d3a63}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0e2135;color:#fff;
  padding:10px 15px;border-radius:9px;font-size:12.5px;z-index:90;box-shadow:0 12px 30px rgba(10,22,38,.3);max-width:90vw}

/* ---------- misc ---------- */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px}
.flow .st{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 10px;color:var(--muted)}
.flow .st.done{background:var(--ok-soft);border-color:#b9e3cf;color:var(--ok)}
.flow .st.now{background:var(--blue-soft);border-color:#bcd6fa;color:var(--blue-ink);font-weight:500}
.flow .ar{color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--ink-2)}
.chip.on{background:var(--blue-soft);border-color:#bcd6fa;color:var(--blue-ink);font-weight:500}
.scrollx{overflow-x:auto}
.msgs{display:grid;gap:11px;padding:14px;overflow:auto}
.msg{max-width:84%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.55}
.msg.u{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.a{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.a .src{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted)}
.askbar{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:var(--panel)}
.askbar input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
svg .gl{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font-size:9.5px}
@media (max-width:1180px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c23,.c32{grid-template-columns:1fr}}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .2s}
  .side.on{transform:none}
  .main{margin-left:0;width:100%}
  .burger{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:8px}
  .c2,.c3,.c4{grid-template-columns:1fr}
  .searchwrap{max-width:none}
  .page{padding:14px 12px 60px}
  .form{grid-template-columns:1fr}
}

/* ================= employee app + split view ================= */
:root{--a:#0d6f63;--a2:#0a574e;--asoft:#e2f1ee;--aink:#073f38;--pbg:#f4f6f5;--pcard:#fff;--pink:#15201e;--pmute:#5d6d69;--pline:#dfe6e3;--vb:44px;--pw:420px}
:root[data-theme="dark"]{--pbg:#0f1716;--pcard:#16211f;--pink:#e6efec;--pmute:#94a8a3;--pline:#26342f;--asoft:#123430;--aink:#9fe0d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pbg:#0f1716;--pcard:#16211f;--pink:#e6efec;--pmute:#94a8a3;--pline:#26342f;--asoft:#123430;--aink:#9fe0d4}}
body{padding-top:var(--vb)}
.viewbar{position:fixed;top:0;left:0;right:0;height:var(--vb);z-index:90;display:flex;align-items:center;gap:12px;padding:0 14px;background:#07131f;color:#cfdbe8;border-bottom:1px solid #1b2e44}
.viewbar b{color:#fff;font-weight:600;font-size:13px}
.viewbar .vsub{font-size:11.5px;color:#7f97b1}
.vseg{display:inline-flex;background:#0f2234;border:1px solid #213a55;border-radius:9px;padding:2px;margin-left:auto}
.vseg button{padding:5px 11px;border-radius:7px;font-size:12px;color:#a9bdd2;white-space:nowrap}
.vseg button.on{background:#2a5fa8;color:#fff}
.vbtn{font-size:12px;color:#a9bdd2;border:1px solid #213a55;border-radius:8px;padding:5px 9px}
.side{top:var(--vb)!important;bottom:0}
.top{top:var(--vb)!important}
.drawer,.scrim{top:var(--vb)!important}
.emp{position:fixed;top:var(--vb);right:0;bottom:0;width:var(--pw);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;
  background:linear-gradient(180deg,#dfe7e5,#cfdad7);border-left:1px solid var(--line)}
:root[data-theme="dark"] .emp{background:linear-gradient(180deg,#0c1716,#0a1211)}
body.v-split .emp{display:flex}
body.v-split .main{width:calc(100% - 246px - var(--pw))}
body.v-split .drawer{right:var(--pw);width:min(600px,calc(100% - 246px - var(--pw)))}
body.v-split .scrim{right:var(--pw)}
body.v-emp .shell{display:none}
body.v-emp .emp{display:flex;left:0;width:100%}
@media (max-width:1600px){body.v-split .c4{grid-template-columns:repeat(2,minmax(0,1fr))}body.v-split .c23,body.v-split .c32,body.v-split .c3{grid-template-columns:1fr}}
.ecap{font-size:11.5px;color:#4a5f5a;margin-bottom:8px;text-align:center}
:root[data-theme="dark"] .ecap{color:#8aa39d}
.frame{width:372px;height:min(780px,calc(100% - 50px));border-radius:42px;background:#0b0f0e;padding:11px;box-shadow:0 30px 60px rgba(8,30,26,.28),inset 0 0 0 2px #2a3230}
.screen{width:100%;height:100%;border-radius:32px;overflow:hidden;background:var(--pbg);position:relative;display:flex;flex-direction:column}
.relay{position:absolute;left:-160px;top:46%;width:320px;pointer-events:none;z-index:95;display:flex;justify-content:center}
.relay span{background:#0d6f63;color:#fff;font-size:12px;padding:7px 12px;border-radius:20px;box-shadow:0 8px 20px rgba(13,111,99,.35);opacity:0;white-space:nowrap}
.relay span.go{animation:rgo 2s ease forwards}.relay span.back{background:#1a5fd0;animation:rback 2s ease forwards}

<script>
/* ============================================================
   CareOps — shared synthetic dataset (deterministic, seeded)
   Every module reads from DB. Records cross-reference by id.
   ============================================================ */
let _s = 20260920;
function rnd(){ _s = (_s*1664525 + 1013904223) % 4294967296; return _s/4294967296; }
function ri(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function chance(p){ return rnd() < p; }

const FACILITIES = [
  {id:"PAR", name:"St. Gabriel Paris Central", city:"Paris", beds:640, dir:"Hélène Roussel"},
  {id:"LYO", name:"St. Gabriel Lyon",          city:"Lyon",  beds:410, dir:"Marc Villeneuve"},
  {id:"LIL", name:"St. Gabriel Lille",         city:"Lille", beds:295, dir:"Awa Diallo"},
  {id:"NAN", name:"St. Gabriel Nantes",        city:"Nantes",beds:240, dir:"Pierre Lacroix"},
];
const DEPTS = ["Emergency","ICU","Surgery","Radiology","Maternity","Pharmacy","Laboratory","Facilities","HR","Finance","Procurement","IT"];
const MONTHS = ["Oct 25","Nov 25","Dec 25","Jan 26","Feb 26","Mar 26","Apr 26","May 26","Jun 26","Jul 26","Aug 26","Sep 26"];
const MONTH_KEYS = ["2025-10","2025-11","2025-12","2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09"];

const FIRST = ["Marie","Thomas","Nadia","Lucas","Amina","Julien","Sophie","Karim","Claire","Yann","Fatou","Antoine","Léa","Mehdi","Camille","Hugo","Sarah","Paul","Inès","Olivier","Chloé","Samir","Élodie","Victor","Aïcha","Nicolas","Manon","Idriss","Céline","Rémi"];
const LAST  = ["Dupont","Martin","Mensah","Bernard","Haddad","Moreau","Girard","Benali","Lefevre","Rousseau","Diop","Marchand","Fontaine","Amrani","Perrot","Blanchard","Noiret","Da Silva","Kouassi","Leroy","Vasseur","Traoré","Chevalier","Barbier","Sy","Renard","Colin","Bakri","Prevost","Guillot"];
const ROLES = {
  Emergency:["Emergency nurse","ER physician","Triage nurse","Care assistant"],
  ICU:["ICU nurse","Intensivist","Respiratory therapist"],
  Surgery:["Scrub nurse","Surgeon","Anaesthetist","OR coordinator"],
  Radiology:["Radiographer","Radiologist","Imaging technician"],
  Maternity:["Midwife","Obstetrician","Maternity nurse"],
  Pharmacy:["Hospital pharmacist","Pharmacy technician"],
  Laboratory:["Lab technician","Biologist","Sample coordinator"],
  Facilities:["Maintenance technician","Facilities supervisor","Cleaner"],
  HR:["HR officer","Payroll administrator","HR business partner"],
  Finance:["Management controller","Accountant","Finance analyst"],
  Procurement:["Buyer","Procurement officer","Contract manager"],
  IT:["System administrator","Support technician","Data protection officer"]
};
const SUP_A = ["BioLab","MediTech","Pharma","SterilCare","NordMed","HospiLog","OxyGen","ScanPlus","CleanMed","Vitalis","Aurora","Delta","Praxis","EuroCare","Lumen","Arkos","Medisys","Nova"];
const SUP_B = ["Europe","France","Solutions","Group","Santé","Systems","Partners","Industries","Medical","Services"];
const CATS = ["Medical devices","Pharmaceuticals","Laboratory","Imaging","Consumables","Facility services","Agency staffing","IT & software","Logistics","Catering"];

const fmtEUR = n => "€" + (Math.abs(n)>=1e6 ? (n/1e6).toFixed(n>=1e7?1:2)+"M" : Math.abs(n)>=1e3 ? Math.round(n/1e3).toLocaleString("en-GB")+"k" : Math.round(n).toLocaleString("en-GB"));
const fmtEUR0 = n => "€" + Math.round(n).toLocaleString("en-GB");
const pad = (n,l=4) => String(n).padStart(l,"0");
const dstr = d => d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const TODAY = new Date(2026,8,20);
const dayAdd = n => { const d = new Date(TODAY); d.setDate(d.getDate()+n); return d; };
const iso = d => d.toISOString().slice(0,10);
const mkey = d => d.toISOString().slice(0,7);
const daysTo = s => Math.round((new Date(s) - TODAY)/86400000);

const DB = { facilities:FACILITIES, depts:DEPTS, employees:[], suppliers:[], pos:[], invoices:[], assets:[], documents:[],
             budgets:[], controls:[], findings:[], audits:[], workflows:[], runs:[], tasks:[], coverage:[],
             opportunities:[], events:[], integrations:[], reports:[], notifications:[] };

/* ---- budgets: per facility x department, 12 months of actuals ---- */
const DEPT_WEIGHT = {Emergency:1.5,ICU:1.6,Surgery:1.8,Radiology:1.2,Maternity:1.0,Pharmacy:1.4,Laboratory:0.9,Facilities:0.7,HR:0.4,Finance:0.35,Procurement:0.3,IT:0.55};
FACILITIES.forEach(f=>{
  const scale = f.beds/640;
  DEPTS.forEach(d=>{
    const annual = Math.round(1_685_000*DEPT_WEIGHT[d]*scale/1000)*1000;
    const stress = d==="Pharmacy"?1.14 : d==="Radiology"?1.08 : d==="Emergency"?1.05 : d==="Facilities"?0.93 : 0.97+rnd()*0.08;
    const monthly = MONTH_KEYS.map((k,i)=>{
      const season = 1 + (i>=3&&i<=5 ? .07 : i>=9 ? .05 : -.02);
      return Math.round(annual/12*stress*season*(0.94+rnd()*0.12));
    });
    DB.budgets.push({id:`BUD-${f.id}-${d.slice(0,3).toUpperCase()}`, facility:f.id, dept:d, annual, monthly,
      actual: monthly.reduce((a,b)=>a+b,0), owner: d+" manager", fy:"FY2026"});
  });
});

/* ---- employees ---- */
const CONTRACTS = ["CDI","CDI","CDI","CDI","CDD","Agency","Apprentice"];
for(let i=1;i<=1284;i++){
  const f = chance(.46)?FACILITIES[0]:chance(.5)?FACILITIES[1]:chance(.6)?FACILITIES[2]:FACILITIES[3];
  const dept = pick(DEPTS);
  const ctype = pick(CONTRACTS);
  const start = dayAdd(-ri(60,4200));
  const contractEnd = ctype==="CDI" ? null : iso(dayAdd(ri(-20,420)));
  const credEnd = ["Emergency","ICU","Surgery","Radiology","Maternity","Pharmacy","Laboratory"].includes(dept) ? iso(dayAdd(ri(-30,900))) : null;
  DB.employees.push({
    id:"EMP-"+pad(i), name: pick(FIRST)+" "+pick(LAST), dept, facility:f.id, role: pick(ROLES[dept]),
    contract:ctype, start:iso(start), contractEnd, credential: credEnd?pick(["RN licence","Medical registration","Radiation safety","Pharmacist licence","Lab certification"]):null,
    credentialEnd:credEnd, fte: chance(.82)?1:chance(.6)?0.8:0.5,
    salary: Math.round((32000+ri(0,58000))/100)*100,
    training: chance(.19)?"Overdue":chance(.15)?"Due soon":"Up to date",
    status: chance(.03)?"On leave":"Active", manager: pick(FIRST)+" "+pick(LAST),
    email:"", onboarding: chance(.05)?"In progress":"Complete"
  });
}
DB.employees.forEach(e=> e.email = e.name.toLowerCase().normalize("NFD").replace(/[^a-z ]/g,"").replace(" ",".")+"@st-gabriel.demo");

/* ---- suppliers ---- */
for(let i=1;i<=187;i++){
  const name = pick(SUP_A)+" "+pick(SUP_B);
  DB.suppliers.push({ id:"SUP-"+pad(i,3), name: name + (i>60? " "+i : ""), category: pick(CATS),
    risk: chance(.08)?"High":chance(.24)?"Medium":"Low",
    onTime: ri(72,99), quality: ri(74,99), contractEnd: iso(dayAdd(ri(-40,900))),
    contact: "contact@"+name.toLowerCase().replace(/[^a-z]/g,"")+".demo", spend:0, poCount:0, invCount:0, disputes:0 });
}

/* ---- purchase orders ---- */
const PO_STATUS = ["Delivered","Delivered","Delivered","Partially delivered","Open","Open","Awaiting approval","Cancelled"];
for(let i=1;i<=246;i++){
  const s = pick(DB.suppliers), f = pick(FACILITIES), d = pick(DEPTS);
  const created = dayAdd(-ri(5,350));
  const amount = Math.round((1200+rnd()*rnd()*260000)/10)*10;
  DB.pos.push({ id:"PO-"+(2000+i), supplier:s.id, facility:f.id, dept:d, amount, created:iso(created),
    expected: iso(new Date(created.getTime()+ri(5,60)*86400000)), status: pick(PO_STATUS),
    item: pick(["Surgical consumables","IV pumps","Reagent kits","Sterile gowns","Contrast media","Ward beds","Cleaning contract","Agency nursing","Endoscope service","Oxygen supply","Imaging maintenance","Laptops & tablets","Uniform supply","Pharmacy stock"]),
    requester: pick(DB.employees).id, approver: chance(.5)?"Finance controller":"Department head" });
}

/* ---- invoices ---- */
const EXC = ["Price variance vs PO","No matching PO","Quantity mismatch","Duplicate invoice suspected","Missing delivery note","VAT mismatch"];
for(let i=1;i<=428;i++){
  const po = chance(.87) ? pick(DB.pos) : null;
  const s = po ? DB.suppliers.find(x=>x.id===po.supplier) : pick(DB.suppliers);
  const d = dayAdd(-ri(1,350));
  const base = po ? po.amount : Math.round((800+rnd()*rnd()*90000)/10)*10;
  const variance = chance(.12) ? Math.round(base*(0.03+rnd()*0.12)) : 0;
  const exception = variance ? pick([EXC[0],EXC[2],EXC[5]]) : (!po && chance(.55)) ? EXC[1] : chance(.04) ? pick([EXC[3],EXC[4]]) : null;
  DB.invoices.push({ id:"INV-2026-"+pad(i), supplier:s.id, po: po?po.id:null, facility: po?po.facility:pick(FACILITIES).id,
    dept: po?po.dept:pick(DEPTS), amount: base+variance, poAmount: po?po.amount:null, variance,
    date: iso(d), month: mkey(d), due: iso(new Date(d.getTime()+ri(20,60)*86400000)),
    status: exception ? "Exception" : chance(.62) ? "Paid" : chance(.5) ? "Approved" : "Pending approval",
    exception, matched: !exception });
}
DB.invoices.forEach(v=>{ const s=DB.suppliers.find(x=>x.id===v.supplier); s.spend+=v.amount; s.invCount++; if(v.exception) s.disputes++; });

/* ---------------- charts (inline SVG, computed from filtered data) ------------- */
function lineChart(labels, series, opts={}){
  const w=opts.w||640,h=opts.h||190,pl=46,pr=12,pt=12,pb=24;
  const all = series.flatMap(s=>s.v);
  const max = Math.max(...all)*1.12, min = 0;
  const x = i => pl + i*(w-pl-pr)/Math.max(labels.length-1,1);
  const y = v => pt + (h-pt-pb) * (1 - (v-min)/(max-min||1));
  const grid = [0,.25,.5,.75,1].map(p=>{ const yy=pt+(h-pt-pb)*p; const val=max-(max-min)*p;
    return `<line class="gl" x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}"/><text class="ax" x="${pl-7}" y="${yy+3}" text-anchor="end">${fmtEUR(val)}</text>`;}).join("");
  const paths = series.map(s=>{
    const d = s.v.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const area = s.fill ? `<path d="${d} L${x(s.v.length-1)},${h-pb} L${pl},${h-pb} Z" fill="${s.color}" opacity=".08"/>` : "";
    return area + `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="${s.dash||""}" stroke-linejoin="round"/>`
      + s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.color}"><title>${labels[i]} · ${s.n}: ${fmtEUR0(v)}</title></circle>`).join("");
  }).join("");
  const xl = labels.map((l,i)=> (labels.length>8 && i%2) ? "" : `<text class="ax" x="${x(i)}" y="${h-7}" text-anchor="middle">${l}</text>`).join("");
  const leg = series.map(s=>`<span style="display:inline-flex;gap:5px;align-items:center;font-size:11.5px;color:var(--ink-2)"><i style="width:9px;height:3px;background:${s.color};border-radius:2px"></i>${s.n}</span>`).join(" ");
  return `<div style="display:flex;gap:12px;margin-bottom:6px">${leg}</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img">${grid}${paths}${xl}</svg>`;
}
function barChart(items, opts={}){
  const w=640, rowH=opts.rowH||26, h=items.length*rowH+8, max=Math.max(...items.map(i=>Math.max(i.a,i.b||0)))||1, pl=opts.pl||112;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">` + items.map((it,i)=>{
    const y=i*rowH+6, bw=(w-pl-70);
    const aw=bw*it.a/max, bwv=bw*(it.b||0)/max;
    const over = it.b && it.a>it.b;
    return `<text class="ax" x="0" y="${y+12}" style="font-size:11px;fill:var(--ink-2)">${esc(it.label)}</text>
      <rect x="${pl}" y="${y+3}" width="${bwv}" height="14" rx="3" fill="var(--line)"><title>Budget ${fmtEUR0(it.b||0)}</title></rect>
      <rect x="${pl}" y="${y+3}" width="${aw}" height="14" rx="3" fill="${over?"var(--bad)":"var(--blue)"}"><title>Actual ${fmtEUR0(it.a)}</title></rect>
      <text class="ax" x="${w-4}" y="${y+14}" text-anchor="end" style="font-size:11px;fill:${over?"var(--bad)":"var(--ink-2)"}">${fmtEUR(it.a)}</text>`;
  }).join("") + `</svg>`;
}
function donut(pct,label,tone="var(--blue)"){
  const r=46,c=2*Math.PI*r;
  return `<svg viewBox="0 0 120 120" style="width:120px;height:120px">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="13"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${tone}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${c*Math.min(pct,100)/100} ${c}" transform="rotate(-90 60 60)"/>
    <text x="60" y="58" text-anchor="middle" style="font-size:21px;font-weight:600;fill:var(--ink)">${pct.toFixed(1)}%</text>
    <text x="60" y="76" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${esc(label)}</text></svg>`;
}
function stackBars(items){ // {label, parts:[{v,color,n}]}
  const max = Math.max(...items.map(i=>i.parts.reduce((a,p)=>a+p.v,0)))||1;
  return items.map(it=>{
    let acc=0; const total=it.parts.reduce((a,p)=>a+p.v,0);
    const seg = it.parts.map(p=>{ const w=p.v/max*100; const s=`<i style="display:block;height:100%;width:${w}%;background:${p.color}" title="${p.n}: ${p.v}"></i>`; acc+=w; return s; }).join("");
    return `<div style="margin-bottom:9px"><div style="display:flex;font-size:11.5px;margin-bottom:3px"><span>${esc(it.label)}</span><span style="margin-left:auto;color:var(--muted)">${total}</span></div>
      <div class="bar" style="display:flex;height:9px">${seg}</div></div>`;
  }).join("");
}

/* ---------------- table engine ------------- */
const TBL = {};
function mountTable(key,cfg){
  const p = TBL[key]||{};
  TBL[key] = Object.assign({page:1,q:"",sort:null,dir:-1,pageSize:10,search:true}, cfg,
    {page:p.page||1, q:p.q||"", sort:p.sort||cfg.sort||null, dir:p.dir!==undefined&&p.sort?p.dir:(cfg.dir||-1)});
  return `<div id="tbl-${key}">${tableHTML(key)}</div>`;
}
function tblData(key){
  const c=TBL[key]; let rows=c.rows();
  if(c.q){ const q=c.q.toLowerCase(); rows = rows.filter(r=> c.cols.some(col=>{
    const v = col.raw? col.raw(r) : (r[col.f]!==undefined? r[col.f] : "");
    return String(v).toLowerCase().includes(q); }) || JSON.stringify(r).toLowerCase().includes(q)); }
  if(c.filterFn) rows = rows.filter(c.filterFn);
  if(c.sort){ const col=c.cols.find(x=>x.k===c.sort); if(!col){ c.sort=null; return rows; }
    rows = rows.slice().sort((a,b)=>{ const va=col.raw?col.raw(a):a[col.f], vb=col.raw?col.raw(b):b[col.f];
      if(typeof va==="number"&&typeof vb==="number") return (va-vb)*c.dir;
      return String(va).localeCompare(String(vb))*c.dir; }); }
  return rows;
}
function tableHTML(key){
  const c=TBL[key], rows=tblData(key);
  const pages=Math.max(1,Math.ceil(rows.length/c.pageSize));
  if(c.page>pages) c.page=pages;
  const slice=rows.slice((c.page-1)*c.pageSize, c.page*c.pageSize);
  const bar = (c.search||c.chips) ? `<div class="tbar">
      ${c.search?`<input type="search" placeholder="Filter ${esc(c.noun||"records")}…" value="${esc(c.q)}" oninput="tblSet('${key}',{q:this.value,page:1})">`:""}
      ${(c.chips||[]).map(ch=>`<button class="chip ${TBL[key].chip===ch.k?"on":""}" onclick="tblChip('${key}','${ch.k}')">${esc(ch.n)}</button>`).join("")}
      <span style="margin-left:auto;color:var(--muted);font-size:11.5px">${rows.length.toLocaleString("en-GB")} of ${c.rows().length.toLocaleString("en-GB")}</span>
      <button class="btn ghost sm" onclick="exportCsv('${key}')">Export CSV</button>
    </div>` : "";
  const head = `<tr>${c.cols.map(col=>`<th class="${c.sort===col.k?"on":""} ${col.num?"num":""}" onclick="tblSort('${key}','${col.k}')">${esc(col.n)} <span class="ar">${c.sort===col.k?(c.dir>0?"▲":"▼"):"⇅"}</span></th>`).join("")}</tr>`;
  const body = slice.length ? slice.map(r=>`<tr onclick="${c.open?c.open(r):""}">${c.cols.map(col=>`<td class="${col.num?"num":""}">${col.cell(r)}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${c.cols.length}"><div class="empty"><b>Nothing matches these filters</b>Clear the filter box or widen the facility and period selectors.</div></td></tr>`;
  return `<div class="scrollx"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="pager"><span>Page ${c.page} of ${pages}</span>
      <div class="r"><button class="pgb" ${c.page<=1?"disabled":""} onclick="tblSet('${key}',{page:${c.page-1}})">Previous</button>
      <button class="pgb" ${c.page>=pages?"disabled":""} onclick="tblSet('${key}',{page:${c.page+1}})">Next</button>
      <select class="ctl" onchange="tblSet('${key}',{pageSize:+this.value,page:1})">
        ${[10,25,50].map(n=>`<option ${c.pageSize===n?"selected":""}>${n}</option>`).join("")}
      </select></div></div>`;
}
function tblSet(key,patch){ Object.assign(TBL[key],patch); document.getElementById("tbl-"+key).innerHTML=tableHTML(key); }
function tblSort(key,k){ const c=TBL[key]; c.dir = c.sort===k ? -c.dir : -1; c.sort=k; tblSet(key,{page:1}); }
function tblChip(key,k){ const c=TBL[key]; c.chip = c.chip===k?null:k;
  const ch=(c.chips||[]).find(x=>x.k===k); c.filterFn = (c.chip&&ch)?ch.fn:null; tblSet(key,{page:1}); }
function exportCsv(key){
  const c=TBL[key], rows=tblData(key);
  const csv=[c.cols.map(x=>x.n).join(",")].concat(rows.slice(0,2000).map(r=>c.cols.map(col=>{
    const v=col.raw?col.raw(r):(r[col.f]??""); return `"${String(v).replace(/"/g,'""')}"`;}).join(","))).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=key+"-careops-demo.csv"; a.click();
  logEvent("Export generated", key+" ("+rows.length+" rows)"); toast("Exported "+rows.length+" rows as CSV");
}

const DRAWER_TAB = {};
function openRec(kind,id){ const p=new URLSearchParams(location.hash.split("?")[1]||""); p.set("rec",kind+":"+id); location.hash = "#/"+currentRoute()+"?"+p; }
function closeDrawer(){ const p=new URLSearchParams(location.hash.split("?")[1]||""); if(!p.has("rec")) return; history.back(); }
function hideDrawer(){ document.getElementById("drawer").classList.remove("on"); document.getElementById("scrim").classList.remove("on"); }
function showDrawer(kind,id){
  const build = DRAWERS[kind]; const d=document.getElementById("drawer");
  if(!build){ hideDrawer(); return; }
  const key=kind+":"+id;
  const html = build(id, DRAWER_TAB[key]||0, key);
  if(html===null){ hideDrawer(); return; }
  d.innerHTML = html; d.classList.add("on"); document.getElementById("scrim").classList.add("on");
}

function drawerShell(key,title,sub,tabs,body,actions=""){
  let i = DRAWER_TAB[key]||0; if(i>=tabs.length){ i=0; DRAWER_TAB[key]=0; }

  return `<div class="dh"><div><h2>${esc(title)}</h2><div class="s">${sub}</div></div>
      <div class="x">${actions}<button class="ctl" onclick="closeDrawer()" aria-label="Close">✕</button></div></div>

    <div class="dbody">${body}</div>`;
}

function answer(q){
  const s=q.toLowerCase(); const ms=PERIODS[STATE.period].months; const buds=F.budgets();
  const src=(txt,conf)=>`<div class="src"><b>Sources:</b> ${txt} · <b>Confidence:</b> ${conf}</div>`;
  if(/budget|over budget|variance|spend/.test(s)){
    const byDept=DEPTS.map(d=>{ let a=0,p=0; buds.filter(b=>b.dept===d).forEach(b=>MONTH_KEYS.forEach((k,i)=>{ if(ms.includes(k)){a+=b.monthly[i];p+=b.annual/12;}}));
      return {d,gap:a-p,pct:p?a/p*100:0};}).filter(x=>x.gap>0).sort((a,b)=>b.gap-a.gap).slice(0,3);
    return `<b>${byDept.length} departments are above plan for ${PERIODS[STATE.period].label}.</b>
      <div style="margin-top:8px">${byDept.map(x=>`<div class="rw" style="padding:6px 0;border:0"><div class="g"><b>${x.d}</b><span class="s">${x.pct.toFixed(1)}% of plan</span></div><b>+${fmtEUR(x.gap)}</b></div>`).join("")}</div>
      <button class="btn sm" style="margin-top:8px" onclick="go('finance')">Open finance</button>
      ${src(`${buds.length} department budgets · ${F.invoices().length} invoices`,"High")}`;
  }
  if(/exception|invoice|unmatched/.test(s)){
    const exc=F.invoices().filter(i=>i.exception).slice(0,4);
    const all=F.invoices().filter(i=>i.exception);
    return `<b>${all.length} invoices are in exception, ${fmtEUR(all.reduce((a,i)=>a+i.amount,0))} in total.</b>
      <div style="margin-top:8px">${exc.map(i=>`<button class="rw" style="padding:6px 0;border:0" onclick="openRec('invoice','${i.id}')"><div class="g"><b>${i.id}</b><span class="s">${esc(supplierOf(i.supplier).name)} · ${esc(i.exception)}</span></div><b>${fmtEUR0(i.amount)}</b></button>`).join("")}</div>
      ${governed("Route all unmatched invoices to the responsible buyers","Finance controller")}
      ${src("Invoice ledger, purchase orders, delivery notes","High")}`;
  }
  if(/contract|expir|renew/.test(s)){
    const e=F.employees().filter(x=>x.contractEnd&&daysTo(x.contractEnd)<=60).slice(0,4);
    const n=F.employees().filter(x=>x.contractEnd&&daysTo(x.contractEnd)<=60).length;
    return `<b>${n} employment contracts expire within 60 days.</b>
      <div style="margin-top:8px">${e.map(x=>`<button class="rw" style="padding:6px 0;border:0" onclick="openRec('employee','${x.id}')"><div class="g"><b>${esc(x.name)}</b><span class="s">${x.dept} · ends ${dstr(new Date(x.contractEnd))}</span></div>${tag(daysTo(x.contractEnd)+"d","warn")}</button>`).join("")}</div>
      ${governed("Start the contract renewal workflow for all "+n+" employees","HR business partner")}
      ${src("Employee register, contract dates","High")}`;
  }
  if(/waste|saving|opportunit/.test(s)){
    const o=F.opportunities().sort((a,b)=>b.value-a.value).slice(0,3);
    return `<b>${fmtEUR(F.opportunities().reduce((a,x)=>a+x.value,0))} of annualised opportunity is identified.</b>
      <div style="margin-top:8px">${o.map(x=>`<button class="rw" style="padding:6px 0;border:0" onclick="openRec('opportunity','${x.id}')"><div class="g"><b>${esc(x.title)}</b><span class="s">${x.area}</span></div><b>${fmtEUR(x.value)}</b></button>`).join("")}</div>
      ${src("Invoices, purchase orders, rosters, asset utilisation","Medium")}`;
  }
  if(/staff|cover|shift|agency|tonight|rota/.test(s)){
    const c=F.coverage().filter(x=>x.shift==="Night");
    const rq=c.reduce((a,x)=>a+x.required,0), sc=c.reduce((a,x)=>a+x.scheduled,0);
    const worst=c.filter(x=>x.required>x.scheduled).sort((a,b)=>(b.required-b.scheduled)-(a.required-a.scheduled)).slice(0,3);
    return `<b>Night coverage is ${sc}/${rq} (${(sc/rq*100).toFixed(1)}%).</b>
      <div style="margin-top:8px">${worst.map(x=>`<div class="rw" style="padding:6px 0;border:0"><div class="g"><b>${x.dept}</b><span class="s">${facName(x.facility)}</span></div>${tag((x.required-x.scheduled)+" short","bad")}</div>`).join("")}</div>
      ${governed("Raise agency shift requests for the three largest gaps","Workforce manager")}
      ${src("Rosters, absence records, agency bookings","High")}`;
  }
  if(/asset|equipment|maintenance|service/.test(s)){
    const a=F.assets().filter(x=>daysTo(x.nextService)<=30);
    const crit=a.filter(x=>x.criticality==="Critical");
    return `<b>${a.length} assets need service within 30 days, ${crit.length} of them critical.</b>
      <div style="margin-top:8px">${crit.slice(0,4).map(x=>`<button class="rw" style="padding:6px 0;border:0" onclick="openRec('asset','${x.id}')"><div class="g"><b>${esc(x.type)} ${x.id}</b><span class="s">${x.dept} · ${x.facility}</span></div>${due(x.nextService)}</button>`).join("")}</div>
      ${src("Asset register, maintenance schedule","High")}`;
  }
  if(/supplier|vendor|risk/.test(s)){
    const t=DB.suppliers.slice().sort((a,b)=>b.spend-a.spend).slice(0,3);
    return `<b>Top suppliers by spend, and ${DB.suppliers.filter(x=>x.risk==="High").length} suppliers rated high risk.</b>
      <div style="margin-top:8px">${t.map(x=>`<button class="rw" style="padding:6px 0;border:0" onclick="openRec('supplier','${x.id}')"><div class="g"><b>${esc(x.name)}</b><span class="s">${x.category} · on-time ${x.onTime}%</span></div><b>${fmtEUR(x.spend)}</b></button>`).join("")}</div>
      ${src("Supplier register, invoice ledger","High")}`;
  }
  if(/compliance|audit|finding|control/.test(s)){
    const f=F.findings().filter(x=>daysTo(x.due)<0);
    return `<b>${F.findings().length} findings are open and ${f.length} are past due.</b>
      <div style="margin-top:8px">${f.slice(0,3).map(x=>`<button class="rw" style="padding:6px 0;border:0" onclick="openRec('finding','${x.id}')"><div class="g"><b>${esc(x.title)}</b><span class="s">${x.domain} · ${x.owner}</span></div>${due(x.due)}</button>`).join("")}</div>
      ${src("Control register, evidence store, audit schedule","High")}`;
  }
  return `I can answer from the records in this demo: budgets and variance, invoices and exceptions, contracts and credentials, suppliers and risk, coverage and agency use, assets and maintenance, compliance findings.
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${["Which departments are over budget?","Show invoice exceptions","Where is the biggest waste?"].map(x=>`<button class="chip" onclick="sendAsk('${x}')">${x}</button>`).join("")}</div>
    ${src("Demo dataset","—")}`;
}

/* ============================================================
   AI, through the artifact "sample" capability (real Claude calls)
   1. HR contract revision: may only pick validated clause variants.
   2. Employee: explain the contract or read it in another language.
   3. Employee: ask a question, answered only from the staff handbook.
   Scripted fallback when AI is not available in this view.
   ============================================================ */
let SAMPLE=null, AI_OK=null, AICTL=null;
const AIS={ explain:{lang:"Plain English",text:"",busy:false,err:""}, ask:{q:"",busy:false,res:null,err:""} };
(async()=>{ await 0; try{ if(window.claude&&typeof window.claude.use==="function") SAMPLE=await window.claude.use("sample"); }catch(e){ SAMPLE=null; }
  AI_OK=!!SAMPLE; render(); renderPhone(); })();
function aiErr(e){ const c=(e&&e.code)||"upstream_error";
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ AI_OK=false; return "AI is not allowed in this view."; }
  if(c==="rate_limited") return "Too many requests right now. Try again in a few minutes.";
  if(c==="cancelled") return ""; if(c==="invalid_json") return "The AI answer could not be used. Try again.";
  if(c==="refused") return "The AI did not process this request."; return "The AI could not answer. Try again."; }
function aiBadge(){ return AI_OK?tag("AI live","ok"):AI_OK===false?tag("AI scripted for the demo","mute"):tag("Connecting to AI…","mute"); }
function stopAI(){ if(AICTL) AICTL.abort(); }

/* ---------- 1. contract revision ---------- */
function scriptedRevision(){
  const c=EP.contract, cur=c.versions[c.versions.length-1].clauses, clauses=Object.assign({},cur), changes=[], refused=[];
  c.comments.forEach(x=>{
    if(x.c==="NIGHT"&&cur.NIGHT==="NIGHT-1"){ clauses.NIGHT="NIGHT-2"; changes.push({k:"NIGHT",from:"NIGHT-1",to:"NIGHT-2",why:"Matches validated clause NIGHT-2. About €1,140 less night allowance per year on the department budget.",whyEmp:"Night shifts are now limited to 50% of your rota."}); }
    else if(x.c==="SITE"&&cur.SITE==="SITE-1"){ clauses.SITE="SITE-2"; changes.push({k:"SITE",from:"SITE-1",to:"SITE-2",why:"Matches validated clause SITE-2. No budget impact.",whyEmp:"You stay at Paris Central unless you agree in writing."}); }
    else if(x.c==="PAY") refused.push({k:"PAY",why:"Pay follows the grid and is not negotiated here. Answer in writing: allowances are detailed in the appendix."});
    else if(x.c==="HOURS") refused.push({k:"HOURS",why:"Part-time is a separate request to discuss with the nurse manager. No part-time clause exists for this post."});
    else refused.push({k:x.c,why:"A question rather than a change. HR should answer in writing."});
  });
  c.proposal={clauses,changes,refused,rejected:[],source:"script"};
}
async function runContractAI(){
  const c=EP.contract;
  if(!SAMPLE){ scriptedRevision(); epLog("AI revision proposed (to be checked)", c.id, "AI assistant"); render(); return; }
  const cur=c.versions[c.versions.length-1].clauses, commented=[...new Set(c.comments.map(x=>x.c))];
  const lib={}; CLS_ORDER.forEach(k=>lib[k]={title:CLS[k].t,variants:CLS[k].v.map(v=>({id:v.id,text:v.x,annual_gross_cost_change:v.cost||0}))});
  const prompt=`You assist the HR office of a French private hospital group. A nurse hired on a fixed-term contract commented on her draft contract.

Strict rules:
1. You never write legal text. You may only replace a clause with another variant of the SAME section, taken from the validated library below, quoting its exact id.
2. The PAY section never changes: pay follows the grid, and a person's previous salary is never a criterion.
3. You only change sections the employee commented on.
4. If no variant answers a remark, or the remark is a question, put it in "refused" with a short explanation for HR.
5. You propose; a person decides.

Validated library: ${JSON.stringify(lib)}
Current version (section → variant): ${JSON.stringify(cur)}
Employee remarks: ${JSON.stringify(c.comments.map(x=>({section:x.c,remark:x.t})))}

Reply with only JSON in this shape:
{"changes":[{"clause":"NIGHT","to":"NIGHT-2","why_hr":"...","why_employee":"..."}],"refused":[{"clause":"PAY","why":"..."}]}
why_hr: one or two sentences for HR, mentioning the budget impact given by annual_gross_cost_change when it is not zero.
why_employee: one plain sentence addressed to the employee.`;
  c.aiBusy=true; c.aiErr=""; render(); AICTL=new AbortController();
  try{
    const out=await SAMPLE.json(prompt,{signal:AICTL.signal,cache:false});
    const changes=[], refused=[], rejected=[];
    (Array.isArray(out&&out.changes)?out.changes:[]).forEach(ch=>{ const k=String(ch.clause||""), to=String(ch.to||"");
      const ok=CLS[k]&&CLS[k].v.some(v=>v.id===to)&&k!=="PAY"&&commented.includes(k)&&to!==cur[k]&&!changes.some(x=>x.k===k);
      if(ok) changes.push({k,from:cur[k],to,why:String(ch.why_hr||""),whyEmp:String(ch.why_employee||"")}); else rejected.push(k+" → "+to); });
    (Array.isArray(out&&out.refused)?out.refused:[]).forEach(r=>{ const k=String(r.clause||""); if(CLS[k]) refused.push({k,why:String(r.why||"")}); });
    const clauses=Object.assign({},cur); changes.forEach(ch=>clauses[ch.k]=ch.to);
    c.proposal={clauses,changes,refused,rejected,source:"live"}; epLog("AI revision proposed (to be checked)", c.id, "AI assistant");
  }catch(e){ c.aiErr=aiErr(e); if(AI_OK===false){ scriptedRevision(); c.aiErr=""; } }
  finally{ c.aiBusy=false; render(); }
}

/* ---- global search ---- */
function searchAll(q){
  q=q.trim().toLowerCase(); if(q.length<2) return [];
  const out=[];
  const add=(kind,id,title,sub)=>out.length<24&&out.push({kind,id,title,sub});
  DB.employees.forEach(e=>{ if(out.length<24&&(e.name.toLowerCase().includes(q)||e.id.toLowerCase().includes(q))) add("employee",e.id,e.name,`Employee · ${e.dept} · ${e.role}`); });
  DB.invoices.forEach(v=>{ if(out.length<24&&v.id.toLowerCase().includes(q)) add("invoice",v.id,v.id,`Invoice · ${supplierOf(v.supplier).name} · ${fmtEUR0(v.amount)}`); });
  DB.pos.forEach(p=>{ if(out.length<24&&(p.id.toLowerCase().includes(q)||p.item.toLowerCase().includes(q))) add("po",p.id,p.id,`Purchase order · ${p.item}`); });
  DB.suppliers.forEach(s=>{ if(out.length<24&&(s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q))) add("supplier",s.id,s.name,`Supplier · ${s.category} · ${fmtEUR(s.spend)}`); });
  DB.assets.forEach(a=>{ if(out.length<24&&(a.id.toLowerCase().includes(q)||a.type.toLowerCase().includes(q))) add("asset",a.id,a.type+" "+a.id,`Asset · ${a.dept} · ${a.facility}`); });
  DB.documents.forEach(d=>{ if(out.length<24&&(d.id.toLowerCase().includes(q)||d.file.toLowerCase().includes(q))) add("document",d.id,d.file,`Document · ${d.type}`); });
  DB.findings.forEach(f=>{ if(out.length<24&&(f.id.toLowerCase().includes(q)||f.title.toLowerCase().includes(q))) add("finding",f.id,f.title,`Finding · ${f.domain}`); });
  DB.workflows.forEach(w=>{ if(out.length<24&&w.name.toLowerCase().includes(q)) add("workflow",w.id,w.name,`Workflow · ${w.owner}`); });
  DB.budgets.forEach(b=>{ if(out.length<24&&(b.dept.toLowerCase().includes(q)&&q.length>3)) add("budget",b.id,b.dept+" budget",`Budget · ${facName(b.facility)} · ${fmtEUR(b.annual)}`); });
  return out;
}
function runSearch(){
  const q=document.getElementById("q").value, box=document.getElementById("qr");
  const res=searchAll(q);
  if(!q.trim()||q.trim().length<2){ box.classList.remove("on"); return; }
  box.innerHTML = res.length ? res.map(r=>`<button onclick="pickResult('${r.kind}','${r.id}')">
      <div><b style="font-weight:500;font-size:12.5px">${esc(r.title)}</b><div class="sec">${esc(r.sub)}</div></div>
      <span class="rid">${r.id}</span></button>`).join("")
    : `<div class="empty"><b>No record matches “${esc(q)}”</b>Try an ID such as INV-2026-0042, EMP-0117 or AST-0309.</div>`;
  box.classList.add("on");
}
function pickResult(kind,id){
  OPENED_IN_APP=true;
  document.getElementById("qr").classList.remove("on");
  document.getElementById("q").value="";
  const home={employee:"hr",invoice:"finance",po:"procurement",supplier:"procurement",asset:"assets",
    document:"documents",finding:"compliance",workflow:"workflows",budget:"finance"}[kind]||"dashboard";
  location.hash = `#/${home}?rec=${kind}:${id}`;
}

/* ---- router ---- */
function currentRoute(){ const h=location.hash.replace(/^#\/?/,"").split("?")[0]; return PAGES[h]?h:"dashboard"; }
function currentRec(){ const p=new URLSearchParams(location.hash.split("?")[1]||""); return p.get("rec"); }
function go(route){ location.hash="#/"+route; }
function render(){
  const r=currentRoute();
  document.getElementById("page").innerHTML = PAGES[r]();

  const fs=document.getElementById("facSel"), ps=document.getElementById("perSel");
  if(fs) fs.value=STATE.facility; if(ps) ps.value=STATE.period;
  const rec=currentRec();
  if(rec){ const [k,...rest]=rec.split(":"); showDrawer(k,rest.join(":")); } else hideDrawer();
  const box=document.getElementById("msgs"); if(box) box.scrollTop=box.scrollHeight;
}
